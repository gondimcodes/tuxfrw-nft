[package]
name = "tuxfrw-web"
version = "1.0.1"
edition = "2021"
authors = ["Marcelo Gondim <gondim@gmail.com>"]
description = "Web Management Dashboard and Control Daemon for TuxFrw-NFT"
license = "GPL-2.0"

[[bin]]
name = "tuxfrw-web"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = { version = "0.5", default-features = false, features = ["std", "password-hash"] }
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
askama = "0.12"
async-trait = "0.1"
socket2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
